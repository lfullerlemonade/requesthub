<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request Hub — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --foam:#fbf8f0; --white:#fff; --seaweed:#092e36; --yellow:#ffc03f; --line:rgba(9,46,54,.14); --muted:#6d7a77; --red:#b23a2e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--foam); color:var(--seaweed); font-family:"Poppins",system-ui,sans-serif; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:430px; padding:38px 34px; background:var(--white); border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 40px rgba(9,46,54,.07); }
  .logo { height:40px; margin-bottom:22px; }
  h1 { margin:0 0 6px; font-size:24px; font-weight:600; }
  p { margin:0 0 24px; color:var(--muted); font-size:14px; line-height:1.55; }
  .button { display:block; width:100%; padding:13px; border:0; border-radius:10px; background:var(--seaweed); color:var(--foam); text-align:center; text-decoration:none; font-size:15px; font-weight:600; }
  .button:hover { opacity:.92; }
  .status { min-height:21px; margin-top:14px; color:var(--muted); font-size:12.5px; line-height:1.5; text-align:center; }
  .status.error { color:var(--red); }
  .foot { margin-top:22px; color:var(--muted); font-size:11.5px; text-align:center; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.svg" alt="The Sunny" />
    <h1>Request Hub</h1>
    <p>Submit and track requests with the same verified account you use for Launch Hub.</p>
    <a class="button" id="signin" href="https://launchcalendar.lemonadehospitality.com/api/auth/start?return_to=https%3A%2F%2Frequests.lemonadehospitality.com%2Fapp">Sign in with your work email</a>
    <div class="status" id="status">Checking your session…</div>
    <div class="foot">Access and visibility are managed in Monday.</div>
  </main>
<script>
function saveSession(session) {
  try {
    localStorage.setItem('rh_token', 'shared');
    localStorage.setItem('rh_email', session.email || '');
    localStorage.setItem('rh_role', session.role === 'admin' ? 'admin' : 'requester');
  } catch (error) {}
}
(async function () {
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.search);
  if (params.get('error')) { status.textContent = params.get('error'); status.className = 'status error'; return; }
  try {
    const response = await fetch('/api/monday?action=session', { credentials:'same-origin' });
    const session = await response.json().catch(() => null);
    if (response.ok && session && session.ok) { saveSession(session); location.replace('/app'); return; }
  } catch (error) {}
  try { localStorage.removeItem('rh_token'); localStorage.removeItem('rh_email'); localStorage.removeItem('rh_role'); } catch (error) {}
  status.textContent = 'Use a verified work email to continue.';
})();
</script>
</body>
</html>
